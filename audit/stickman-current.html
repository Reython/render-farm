/* ================================================================ DRAMA DIRECTOR ==== */
class DramaDirector{
 constructor(m){this.m=m;this.lastDamage=0;this.checkT=0;this.mode='fight';this.dealt={A:1,B:1}}
 update(dt){const m=this.m;if(m.over)return;const t=m.t,D=CONFIG.drama,T=m.cfg.matchTime;
  const escalate=Math.min(D.escalate,T*.78),finishAt=Math.min(D.finishAt,T-5);
  if(t-this.lastDamage>D.stall){m.aiUrgency=1.3;for(const f of m.fighters){f.thinkT=0;f.basicWait=0;const foe=f.opponent();if(foe){f.intent.mx=Math.sign(foe.x-f.x);f.intent.mz=Math.sign(foe.z-f.z)}}}
  if(t>escalate)this.mode='escalate';
  this.checkT-=dt;if(this.checkT<=0){this.checkT=.5;const a=m.fighters[0],b=m.fighters[1],fa=a.hp/a.maxHp,fb=b.hp/b.maxHp;
   this.dealt.A=fa+D.comebackGap<fb?D.comebackBoost:1;this.dealt.B=fb+D.comebackGap<fa?D.comebackBoost:1;
   if(t>escalate){this.dealt.A*=1+(t-escalate)*.045;this.dealt.B*=1+(t-escalate)*.045}
  }
  if(t>=finishAt&&!this.finish){this.finish=true;this.mode='finish';m.popup('FINAL EXCHANGE','#ffd966',1);for(const f of m.fighters){f.thinkT=0;f.aiReact=Math.min(f.aiReact,.14);f.ultraMeter=100}}
  if(t>=T-CONFIG.step*.5||m.wallT>=T-CONFIG.step*.5)m.decision();
 }
 onDamage(){this.lastDamage=this.m.t}
}
