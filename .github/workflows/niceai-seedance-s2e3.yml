# Season 2 Episode 3 "The Woman in the Garden" — 30 clips, frame-chain (first_frame).
# Stage A (gen): independent clips, plain generation.
# Stage B (gen_chain1): chained clips whose predecessor is in stage A.
# Stage C (gen_chain2): chained clips whose predecessor is in stage B (5<-4, 14<-13, 21<-20).
# Chained clips start from the predecessor's final frame (ffmpeg last frame -> first_frame data URI).
# Generation logic lives in scripts/niceai-gen-clip.sh (same proven spec: seedance-2.5,
# 20s, 720x1280, 9:16, generate_audio true; verbatim once, then softened on copyright filter).
name: NiceAI Seedance 2.5 — Season 2 Episode 3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gen:
    name: gen (clip ${{ matrix.clip }})
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        clip: [1, 3, 6, 7, 9, 11, 12, 15, 17, 18, 19, 22, 23, 24, 25, 27, 29]
    env:
      BASE_URL: https://api.niceai.rest/v1
      USER_AGENT: Mozilla/5.0
    steps:
      - name: Checkout репозитория (S2_EPISODE3_SCRIPT.md)
        uses: actions/checkout@v4
      - name: Генерация клипа (до 4 попыток, fallback при copyright-фильтре, опрос, скачивание)
        env:
          NICEAI_KEY: ${{ secrets.NICEAI_KEY }}
          SCRIPT_FILE: S2_EPISODE3_SCRIPT.md
          PREFIX: s2e3
          CLIP_N: ${{ matrix.clip }}
        run: bash scripts/niceai-gen-clip.sh
      - name: Загрузить артефакт niceai-s2e3-clip-N
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: niceai-s2e3-clip-${{ matrix.clip }}
          path: |
            s2e3-clip-${{ matrix.clip }}.log
            create.json
            status.json
            body.json
            s2e3-clip-${{ matrix.clip }}.mp4
          if-no-files-found: warn

  gen_chain1:
    name: gen_chain1 (clip ${{ matrix.clip }} <- ${{ matrix.prev }})
    runs-on: ubuntu-latest
    timeout-minutes: 200
    needs: gen
    if: always()
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - { clip: 2, prev: 1 }
          - { clip: 4, prev: 3 }
          - { clip: 8, prev: 7 }
          - { clip: 10, prev: 9 }
          - { clip: 13, prev: 12 }
          - { clip: 16, prev: 15 }
          - { clip: 20, prev: 19 }
          - { clip: 26, prev: 25 }
          - { clip: 28, prev: 27 }
          - { clip: 30, prev: 29 }
    env:
      BASE_URL: https://api.niceai.rest/v1
      USER_AGENT: Mozilla/5.0
    steps:
      - name: Checkout репозитория (S2_EPISODE3_SCRIPT.md)
        uses: actions/checkout@v4
      - name: Скачать видео предшественника (clip ${{ matrix.prev }})
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: niceai-s2e3-clip-${{ matrix.prev }}
          path: prev
      - name: Извлечь последний кадр предшественника (first_frame)
        continue-on-error: true
        run: |
          PREV_MP4="prev/s2e3-clip-${{ matrix.prev }}.mp4"
          if [ -f "$PREV_MP4" ]; then
            echo "Predecessor video: $PREV_MP4"
            ls -lh "$PREV_MP4"
            ffmpeg -y -sseof -1 -i "$PREV_MP4" -vf scale=720:1280 -frames:v 1 -q:v 2 first_frame.jpg && ls -lh first_frame.jpg && file first_frame.jpg
          else
            echo "Предупреждение: видео предшественника $PREV_MP4 не найдено — генерация без first_frame"
          fi
      - name: Генерация клипа с first_frame (до 4 попыток, fallback при copyright-фильтре, опрос, скачивание)
        env:
          NICEAI_KEY: ${{ secrets.NICEAI_KEY }}
          SCRIPT_FILE: S2_EPISODE3_SCRIPT.md
          PREFIX: s2e3
          CLIP_N: ${{ matrix.clip }}
        run: bash scripts/niceai-gen-clip.sh
      - name: Загрузить артефакт niceai-s2e3-clip-N
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: niceai-s2e3-clip-${{ matrix.clip }}
          path: |
            s2e3-clip-${{ matrix.clip }}.log
            create.json
            status.json
            body.json
            first_frame.jpg
            s2e3-clip-${{ matrix.clip }}.mp4
          if-no-files-found: warn

  gen_chain2:
    name: gen_chain2 (clip ${{ matrix.clip }} <- ${{ matrix.prev }})
    runs-on: ubuntu-latest
    timeout-minutes: 200
    needs: gen_chain1
    if: always()
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - { clip: 5, prev: 4 }
          - { clip: 14, prev: 13 }
          - { clip: 21, prev: 20 }
    env:
      BASE_URL: https://api.niceai.rest/v1
      USER_AGENT: Mozilla/5.0
    steps:
      - name: Checkout репозитория (S2_EPISODE3_SCRIPT.md)
        uses: actions/checkout@v4
      - name: Скачать видео предшественника (clip ${{ matrix.prev }})
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: niceai-s2e3-clip-${{ matrix.prev }}
          path: prev
      - name: Извлечь последний кадр предшественника (first_frame)
        continue-on-error: true
        run: |
          PREV_MP4="prev/s2e3-clip-${{ matrix.prev }}.mp4"
          if [ -f "$PREV_MP4" ]; then
            echo "Predecessor video: $PREV_MP4"
            ls -lh "$PREV_MP4"
            ffmpeg -y -sseof -1 -i "$PREV_MP4" -vf scale=720:1280 -frames:v 1 -q:v 2 first_frame.jpg && ls -lh first_frame.jpg && file first_frame.jpg
          else
            echo "Предупреждение: видео предшественника $PREV_MP4 не найдено — генерация без first_frame"
          fi
      - name: Генерация клипа с first_frame (до 4 попыток, fallback при copyright-фильтре, опрос, скачивание)
        env:
          NICEAI_KEY: ${{ secrets.NICEAI_KEY }}
          SCRIPT_FILE: S2_EPISODE3_SCRIPT.md
          PREFIX: s2e3
          CLIP_N: ${{ matrix.clip }}
        run: bash scripts/niceai-gen-clip.sh
      - name: Загрузить артефакт niceai-s2e3-clip-N
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: niceai-s2e3-clip-${{ matrix.clip }}
          path: |
            s2e3-clip-${{ matrix.clip }}.log
            create.json
            status.json
            body.json
            first_frame.jpg
            s2e3-clip-${{ matrix.clip }}.mp4
          if-no-files-found: warn
