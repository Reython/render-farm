name: NiceAI Seedance 2.5 — Pick Me Up Episode 1
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        clip: [1, 2, 3, 4, 5]
    env:
      NICEAI_API_KEY: ${{ secrets.NICEAI_KEY }}
      NICEAI_BASE_URL: ${{ vars.NICEAI_BASE_URL || 'https://api.niceai.ai' }}
      MODEL: seedance-2.5
      SECONDS: "20"
      SIZE: 720x1280
      RESOLUTION: 720p
      ASPECT: 9:16
      CLIP_N: ${{ matrix.clip }}
      PROMPT_FILE: pmu/prompts_ep1.json
    steps:
      - uses: actions/checkout@v4
      - name: Check tools
        run: |
          command -v curl >/dev/null || { echo "curl missing"; exit 1; }
          command -v jq >/dev/null || { echo "jq missing"; exit 1; }
          command -v python3 >/dev/null || { echo "python3 missing"; exit 1; }
          echo "Tools OK"
      - name: Extract prompt for this clip
        id: prompt
        run: |
          set -euo pipefail
          echo "Clip: $CLIP_N"
          echo "Prompt file: $PROMPT_FILE"
          test -f "$PROMPT_FILE" || { echo "ERROR: prompt file not found: $PROMPT_FILE"; exit 1; }
          PROMPT=$(jq -r --argjson clip "$CLIP_N" '.[] | select(.clip == $clip) | .prompt // empty' "$PROMPT_FILE")
          if [ -z "$PROMPT" ]; then
            echo "ERROR: no prompt found for clip $CLIP_N in $PROMPT_FILE"
            exit 1
          fi
          PLEN=$(printf '%s' "$PROMPT" | wc -c)
          echo "Prompt length: $PLEN chars"
          if [ "$PLEN" -lt 200 ]; then
            echo "ERROR: prompt too short (<200 chars) for clip $CLIP_N"
            exit 1
          fi
          echo "Prompt preview: $(printf '%s' "$PROMPT" | head -c 200)..."
          {
            echo "prompt<<PROMPT_EOF"
            printf '%s\n' "$PROMPT"
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Generate video (Seedance 2.5 via NiceAI)
        env:
          PROMPT: ${{ steps.prompt.outputs.prompt }}
        run: |
          set -euo pipefail
          : "${NICEAI_API_KEY:?NICEAI_KEY secret is not set}"
          ORIGINAL_PROMPT="$PROMPT"
          CURRENT_PROMPT="$ORIGINAL_PROMPT"
          PROMPT_VERSION=verbatim
          LOG="pmu-ep1-clip-${CLIP_N}.log"
          : > "$LOG"
          soften_prompt() {
            local text="$1"
            text=$(printf '%s' "$text" | sed -e 's/[Dd]ivorce/breakup/g' -e 's/[Dd]ivorced/separated/g' -e 's/[Cc]heat on/argue with/g' -e 's/[Cc]heating/betrayal/g' -e 's/[Cc]heated/betrayed/g' -e 's/[Ss]laps/pushes/g' -e 's/[Ss]lap/push/g' -e 's/[Ss]lapped/pushed/g' -e 's/[Ss]houted at/spoke sharply to/g' -e 's/[Ss]houted/raised her voice/g' -e 's/[Ss]houting/raising her voice/g' -e 's/[Cc]onfrontation/argument/g' -e 's/[Cc]onfronts/faces/g' -e 's/[Cc]onfronted/faced/g')
            printf '%s' "$text"
          }
          log() { echo "$*" | tee -a "$LOG"; }
          MAX_ATTEMPTS=3
          COPYRIGHT_HIT=false
          SUCCESS=false
          attempt=1
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            if [ "$attempt" -ge 2 ] && [ "$COPYRIGHT_HIT" = "true" ]; then
              CURRENT_PROMPT=$(soften_prompt "$ORIGINAL_PROMPT")
              PROMPT_VERSION=softened
            fi
            log "=== Attempt $attempt/$MAX_ATTEMPTS ($PROMPT_VERSION prompt) ==="
            log "Model: $MODEL | Seconds: $SECONDS | Size: $SIZE | Resolution: $RESOLUTION | Aspect: $ASPECT | Audio: true"
            log "Prompt length: $(printf '%s' "$CURRENT_PROMPT" | wc -c) chars"
            python3 -c 'import json,os; json.dump({"model": os.environ["MODEL"], "prompt": os.environ["CURRENT_PROMPT"], "seconds": int(os.environ["SECONDS"]), "size": os.environ["SIZE"], "resolution": os.environ["RESOLUTION"], "aspect_ratio": os.environ["ASPECT"], "generate_audio": True}, open("request.json","w"))'
            log "Request body (prompt redacted to first 120 chars):"
            jq '{model, seconds, size, resolution, aspect_ratio, generate_audio, prompt: (.prompt | .[0:120])}' request.json | tee -a "$LOG"
            HTTP=$(curl -sS -o create.json -w '%{http_code}' -X POST "$NICEAI_BASE_URL/v1/videos/generations" -H "Authorization: Bearer $NICEAI_API_KEY" -H 'Content-Type: application/json' --data-binary @request.json || echo "000")
            log "Create HTTP: $HTTP"
            cat create.json | tee -a "$LOG"; echo | tee -a "$LOG"
            if echo "$HTTP" | grep -Eq '^(401|403)$'; then
              log "ERROR: auth failed (HTTP $HTTP) — check NICEAI_KEY"
              exit 1
            fi
            if grep -qi 'copyright' create.json; then
              log "Copyright refusal detected in create response"
              COPYRIGHT_HIT=true
              MAX_ATTEMPTS=4
            fi
            TASK_ID=$(jq -r '.data.task_id // .task_id // .data.id // .id // empty' create.json)
            if [ -z "$TASK_ID" ] || [ "$TASK_ID" = "null" ]; then
              log "ERROR: no task_id in create response"
              if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
                log "Retrying in 60s..."
                sleep 60
                attempt=$((attempt+1))
                continue
              fi
              exit 1
            fi
            log "Task ID: $TASK_ID"
            for i in $(seq 1 90); do
              sleep 20
              curl -sS -o status.json "$NICEAI_BASE_URL/v1/videos/generations/$TASK_ID" -H "Authorization: Bearer $NICEAI_API_KEY" || { log "Status request failed (poll $i)"; continue; }
              STATUS=$(jq -r '.data.status // .status // empty' status.json)
              PROGRESS=$(jq -r '.data.progress // .progress // empty' status.json)
              log "Poll $i: status=$STATUS progress=$PROGRESS"
              if [ "$STATUS" = "succeeded" ] || [ "$STATUS" = "completed" ] || [ "$STATUS" = "success" ]; then
                VIDEO_URL=$(jq -r '.data.video_url // .data.url // .data.result_url // .video_url // .url // empty' status.json)
                if [ -z "$VIDEO_URL" ] || [ "$VIDEO_URL" = "null" ]; then
                  log "ERROR: succeeded but no video_url"
                  cat status.json | tee -a "$LOG"
                  exit 1
                fi
                log "Video URL: $VIDEO_URL"
                curl -sSL -o "pmu-ep1-clip-${CLIP_N}.mp4" "$VIDEO_URL"
                SIZE_BYTES=$(stat -c%s "pmu-ep1-clip-${CLIP_N}.mp4" || echo 0)
                log "Downloaded: $SIZE_BYTES bytes"
                if [ "$SIZE_BYTES" -lt 100000 ]; then
                  log "ERROR: file too small"
                  file "pmu-ep1-clip-${CLIP_N}.mp4" | tee -a "$LOG"
                  exit 1
                fi
                file "pmu-ep1-clip-${CLIP_N}.mp4" | tee -a "$LOG"
                SUCCESS=true
                break
              fi
              if [ "$STATUS" = "failed" ] || [ "$STATUS" = "error" ]; then
                log "ERROR: task failed"
                cat status.json | tee -a "$LOG"; echo | tee -a "$LOG"
                if grep -qi 'copyright' status.json; then
                  log "Copyright refusal detected in status response"
                  COPYRIGHT_HIT=true
                  MAX_ATTEMPTS=4
                fi
                break
              fi
            done
            if [ "$SUCCESS" = "true" ]; then
              break
            fi
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              log "Retrying in 60s..."
              sleep 60
            fi
            attempt=$((attempt+1))
          done
          if [ "$SUCCESS" != "true" ]; then
            log "ERROR: all attempts failed for clip $CLIP_N"
            exit 1
          fi
          log "SUCCESS: pmu-ep1-clip-${CLIP_N}.mp4 ready"
      - name: Upload clip artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: niceai-pmu-ep1-clip-${{ matrix.clip }}
          path: |
            pmu-ep1-clip-${{ matrix.clip }}.mp4
            pmu-ep1-clip-${{ matrix.clip }}.log
            request.json
            create.json
            status.json
          if-no-files-found: error
          retention-days: 90
      - name: Add summary
        if: always()
        run: |
          {
            echo "## Pick Me Up — Episode 1, clip ${CLIP_N}"
            echo ""
            echo "- Model: $MODEL"
            echo "- Seconds: $SECONDS"
            echo "- Size: $SIZE"
            echo "- Resolution: $RESOLUTION"
            echo "- Audio: true"
            if [ -f "pmu-ep1-clip-${CLIP_N}.mp4" ]; then
              echo "- File: pmu-ep1-clip-${CLIP_N}.mp4 ($(stat -c%s "pmu-ep1-clip-${CLIP_N}.mp4") bytes)"
            else
              echo "- File: NOT PRODUCED — see log"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
