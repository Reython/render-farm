# Regen S2E3 chained clips (frame-chain) — the main run 42150138027 generated all 13
# chained clips WITHOUT first_frame: step "Извлечь последний кадр" failed on every
# chained job with "ffmpeg: command not found" (exit 127), because ffmpeg is not
# installed on ubuntu-latest. This workflow installs ffmpeg first, then regenerates
# the 13 chained clips with real first_frame chaining.
# Chain1 predecessors come from run 42150138027 (stage A videos), except clip 20
# whose predecessor clip 19 comes from retry run 42158300336. Chain2 predecessors
# come from this run's own chain1 outputs. Artifacts are named niceai-s2e3-clip-N-chain
# to distinguish them from the unchained versions of run 42150138027.
# UPDATE: first_frame is downscaled to 360x640 (q:v 4) — the upstream input-image privacy
# filter (InputImageSensitiveContentDetected.PrivacyInformation) rejects 720x1280 face frames with HTTP 400.
# UPDATE 2: 360x640 did NOT lift the filter — run 42161413938, clip 4 still HTTP 400 PrivacyInformation
# on 3/3 attempts (FIRST_FRAME=19441 bytes). Now taking the frame 3 seconds before the end (-sseof -3),
# which may avoid the face close-up in the final shot.
# UPDATE 3: -sseof -3 rescued only 2/10 in run 42162198037 (clips 2, 20); the rest still HTTP 400
# PrivacyInformation — the -3s frame is the same final shot as the last frame. The privacy filter is
# noisy per attempt (run 42162198037 clip 10: attempts 1,2,4 = HTTP 400, attempt 3 = HTTP 200, then the
# task failed on the copyright filter). Now taking the frame from the middle of the predecessor clip
# (-ss 10), a different shot, most likely a non-face composition.
# UPDATE 4: apt-get install of ffmpeg HANGS on some runners (run 42162198037 gen_chain2 all 3 jobs and
# run 42164625077 clip 4: step "Установить ffmpeg" stuck 12-28 min on apt-get update). The install step
# now has timeouts (120s update / 300s install, with retries) and never hangs or fails the job: if ffmpeg
# stays unavailable, generation falls back to plain (the extraction step has continue-on-error).
# UPDATE 5: apt is UNRELIABLE on runners — in run 42166150414 the ffmpeg install failed silently on some
# runners (no hang, no error — install just never produced ffmpeg), and 3 of 4 chain1 "successes"
# (clips 2, 4, 8) were plain (FIRST_FRAME=none, extraction exit 127). Only clip 28 was truly chained.
# Install now downloads the static ffmpeg build first (johnvansickle.com, ~30 MB), apt (with timeouts)
# only as a fallback, so extraction stops being a per-runner lottery.
name: NiceAI Seedance 2.5 — Season 2 Episode 3 regen chain (ffmpeg fix)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  gen_chain1:
    name: gen_chain1 (clip ${{ matrix.clip }} <- ${{ matrix.prev }})
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - { clip: 2, prev: 1, run_id: 42150138027 }
          - { clip: 4, prev: 3, run_id: 42150138027 }
          - { clip: 8, prev: 7, run_id: 42150138027 }
          - { clip: 10, prev: 9, run_id: 42150138027 }
          - { clip: 13, prev: 12, run_id: 42150138027 }
          - { clip: 16, prev: 15, run_id: 42150138027 }
          - { clip: 20, prev: 19, run_id: 42158300336 }
          - { clip: 26, prev: 25, run_id: 42150138027 }
          - { clip: 28, prev: 27, run_id: 42150138027 }
          - { clip: 30, prev: 29, run_id: 42150138027 }
    env:
      BASE_URL: https://api.niceai.rest/v1
      USER_AGENT: Mozilla/5.0
    steps:
      - name: Checkout репозитория (S2_EPISODE3_SCRIPT.md)
        uses: actions/checkout@v4
      - name: Скачать видео предшественника (clip ${{ matrix.prev }})
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: niceai-s2e3-clip-${{ matrix.prev }}
          path: prev
          run-id: ${{ matrix.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Установить ffmpeg (нужен для извлечения кадра)
        shell: bash
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg уже установлен: $(ffmpeg -version | head -n 1)"
          else
            echo "ffmpeg не найден, скачиваю статическую сборку..."
            STATIC_OK=0
            if curl -fsSL --max-time 120 -o /tmp/ffmpeg.tar.xz "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz" && tar -xJf /tmp/ffmpeg.tar.xz -C /tmp; then
              if sudo install -m 755 /tmp/ffmpeg-*-amd64-static/ffmpeg /usr/local/bin/ffmpeg; then
                STATIC_OK=1
              fi
            fi
            if [ "$STATIC_OK" = "1" ]; then
              echo "Статическая сборка ffmpeg установлена:"
              ffmpeg -version | head -n 1
            else
              echo "Статическая сборка недоступна, пробую apt (с таймаутами)..."
              for attempt in 1 2 3; do
                timeout 120 sudo apt-get update -qq && break || echo "apt-get update не удался (попытка $attempt)"
                sleep 5
              done
              timeout 300 sudo apt-get install -y -qq ffmpeg || echo "Предупреждение: установить ffmpeg не удалось — генерация пойдёт без first_frame"
              if command -v ffmpeg >/dev/null 2>&1; then
                ffmpeg -version | head -n 1
              else
                echo "ffmpeg недоступен — генерация без first_frame"
              fi
            fi
          fi
      - name: Извлечь кадр предшественника (10-я секунда, first_frame)
        continue-on-error: true
        run: |
          PREV_MP4="prev/s2e3-clip-${{ matrix.prev }}.mp4"
          if [ -f "$PREV_MP4" ]; then
            echo "Predecessor video: $PREV_MP4"
            ls -lh "$PREV_MP4"
            ffmpeg -y -i "$PREV_MP4" -ss 10 -vf scale=360:640 -frames:v 1 -q:v 4 first_frame.jpg && ls -lh first_frame.jpg && file first_frame.jpg
          else
            echo "Предупреждение: видео предшественника $PREV_MP4 не найдено — генерация без first_frame"
          fi
      - name: Генерация клипа с first_frame (до 4 попыток, fallback при copyright-фильтре, опрос, скачивание)
        shell: bash
        env:
          NICEAI_KEY: ${{ secrets.NICEAI_KEY }}
          SCRIPT_FILE: S2_EPISODE3_SCRIPT.md
          PREFIX: s2e3
          CLIP_N: ${{ matrix.clip }}
        run: bash scripts/niceai-gen-clip.sh
      - name: Загрузить артефакт niceai-s2e3-clip-N-chain
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: niceai-s2e3-clip-${{ matrix.clip }}-chain
          path: |
            s2e3-clip-${{ matrix.clip }}.log
            create.json
            status.json
            body.json
            first_frame.jpg
            s2e3-clip-${{ matrix.clip }}.mp4
          if-no-files-found: warn
  gen_chain2:
    name: gen_chain2 (clip ${{ matrix.clip }} <- ${{ matrix.prev }})
    runs-on: ubuntu-latest
    timeout-minutes: 200
    needs: gen_chain1
    if: always()
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - { clip: 5, prev: 4 }
          - { clip: 14, prev: 13 }
          - { clip: 21, prev: 20 }
    env:
      BASE_URL: https://api.niceai.rest/v1
      USER_AGENT: Mozilla/5.0
    steps:
      - name: Checkout репозитория (S2_EPISODE3_SCRIPT.md)
        uses: actions/checkout@v4
      - name: Скачать видео предшественника (clip ${{ matrix.prev }})
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: niceai-s2e3-clip-${{ matrix.prev }}-chain
          path: prev
      - name: Установить ffmpeg (нужен для извлечения кадра)
        shell: bash
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg уже установлен: $(ffmpeg -version | head -n 1)"
          else
            echo "ffmpeg не найден, скачиваю статическую сборку..."
            STATIC_OK=0
            if curl -fsSL --max-time 120 -o /tmp/ffmpeg.tar.xz "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz" && tar -xJf /tmp/ffmpeg.tar.xz -C /tmp; then
              if sudo install -m 755 /tmp/ffmpeg-*-amd64-static/ffmpeg /usr/local/bin/ffmpeg; then
                STATIC_OK=1
              fi
            fi
            if [ "$STATIC_OK" = "1" ]; then
              echo "Статическая сборка ffmpeg установлена:"
              ffmpeg -version | head -n 1
            else
              echo "Статическая сборка недоступна, пробую apt (с таймаутами)..."
              for attempt in 1 2 3; do
                timeout 120 sudo apt-get update -qq && break || echo "apt-get update не удался (попытка $attempt)"
                sleep 5
              done
              timeout 300 sudo apt-get install -y -qq ffmpeg || echo "Предупреждение: установить ffmpeg не удалось — генерация пойдёт без first_frame"
              if command -v ffmpeg >/dev/null 2>&1; then
                ffmpeg -version | head -n 1
              else
                echo "ffmpeg недоступен — генерация без first_frame"
              fi
            fi
          fi
      - name: Извлечь кадр предшественника (10-я секунда, first_frame)
        continue-on-error: true
        run: |
          PREV_MP4="prev/s2e3-clip-${{ matrix.prev }}.mp4"
          if [ -f "$PREV_MP4" ]; then
            echo "Predecessor video: $PREV_MP4"
            ls -lh "$PREV_MP4"
            ffmpeg -y -i "$PREV_MP4" -ss 10 -vf scale=360:640 -frames:v 1 -q:v 4 first_frame.jpg && ls -lh first_frame.jpg && file first_frame.jpg
          else
            echo "Предупреждение: видео предшественника $PREV_MP4 не найдено — генерация без first_frame"
          fi
      - name: Генерация клипа с first_frame (до 4 попыток, fallback при copyright-фильтре, опрос, скачивание)
        shell: bash
        env:
          NICEAI_KEY: ${{ secrets.NICEAI_KEY }}
          SCRIPT_FILE: S2_EPISODE3_SCRIPT.md
          PREFIX: s2e3
          CLIP_N: ${{ matrix.clip }}
        run: bash scripts/niceai-gen-clip.sh
      - name: Загрузить артефакт niceai-s2e3-clip-N-chain
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: niceai-s2e3-clip-${{ matrix.clip }}-chain
          path: |
            s2e3-clip-${{ matrix.clip }}.log
            create.json
            status.json
            body.json
            first_frame.jpg
            s2e3-clip-${{ matrix.clip }}.mp4
          if-no-files-found: warn
